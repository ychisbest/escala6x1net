<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Escala 6x1 - Guía Laboral</title>
  <desc id="desc">Información sobre jornada laboral 6x1, derechos y reforma en Brasil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1017" />
      <stop offset="100%" stop-color="#1a1f2b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec7a12" />
      <stop offset="100%" stop-color="#527c52" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1040" cy="120" r="180" fill="#ec7a12" opacity="0.12" />
  <circle cx="120" cy="560" r="210" fill="#527c52" opacity="0.12" />

  <rect x="72" y="72" width="220" height="80" rx="16" fill="#ec7a12" />
  <text x="182" y="124" text-anchor="middle" fill="#ffffff" font-size="42" font-family="'JetBrains Mono', monospace" font-weight="700">6x1</text>

  <text x="72" y="250" fill="#ffffff" font-size="72" font-family="'DM Serif Display', serif" font-weight="700">Escala 6x1</text>
  <text x="72" y="310" fill="#d5dae2" font-size="42" font-family="'Source Sans 3', sans-serif">Guía completa sobre jornada laboral</text>
  <text x="72" y="360" fill="#d5dae2" font-size="42" font-family="'Source Sans 3', sans-serif">derechos y reforma en Brasil</text>

  <rect x="72" y="430" width="640" height="4" fill="url(#accent)" />
  <text x="72" y="500" fill="#b0b9c9" font-size="32" font-family="'Source Sans 3', sans-serif">escala6x1.net</text>
</svg>
